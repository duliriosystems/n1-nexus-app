<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>N1 Nexus</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');
* { box-sizing: border-box; }
body { margin: 0; }
.n1-display { font-family: 'Space Grotesk', sans-serif; }
.n1-body { font-family: 'IBM Plex Sans', sans-serif; }
.n1-mono { font-family: 'IBM Plex Mono', monospace; }
.n1-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
.n1-scroll::-webkit-scrollbar-thumb { background: #C9C6B6; border-radius: 4px; }
.n1-row:hover { background: #F7F6F1; cursor: pointer; }
@media (min-width: 640px) {
  .n1-dashboard-grid { grid-template-columns: repeat(5, 1fr) !important; }
  .n1-dashboard-charts { grid-template-columns: 1fr 1fr !important; }
}
</style>
</head>
